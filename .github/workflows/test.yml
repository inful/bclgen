name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Default cone-mode sparse-checkout has been observed to leave Go
          # unable to find packages on a freshly-initialized single-commit
          # repo; full checkout avoids the whole class of issues.
          sparse-checkout: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false   # no go.sum yet (no third-party deps)

      - name: debug working tree
        run: |
          echo "pwd=$(pwd)"
          echo "--- tree:"
          ls -la
          echo "--- go.mod:"
          cat go.mod
          echo "--- .git/HEAD:"
          cat .git/HEAD 2>&1 || true
          echo "--- go list ./... :"
          go list ./... 2>&1 || true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -count=1 ./...

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files needing gofmt:"
            echo "$out"
            exit 1
          fi

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.14.0
          args: --timeout=5m

      # Smoke-test the goreleaser config so a bad .goreleaser.yml is caught
      # before cutting a tag.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --skip=publish --clean
