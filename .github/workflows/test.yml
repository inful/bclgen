name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false   # no go.sum yet (no third-party deps)

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -count=1 ./...

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files needing gofmt:"
            echo "$out"
            exit 1
          fi

      # Vulnerability scan. The bclgen module is stdlib-only, so this
      # should always pass today, but the dependency graph can change
      # (and Go's own stdlib versions are tracked here) so the step
      # stays in place as a tripwire. golangci-lint does not bundle
      # govuln, so it runs as a separate tool.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          args: --timeout=5m

      # Smoke-test the goreleaser config so a bad .goreleaser.yml is caught
      # before cutting a tag.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --snapshot --skip=publish --clean
