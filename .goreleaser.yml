# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: bclgen

# Build statically-linked binaries for the major OS/arch combinations.
builds:
  - id: bclgen
    main: ./cmd/bclgen
    binary: bclgen
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      # Stamp the release version into the binary so 'bclgen -version'
      # reports which build is running.
      - -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Group commits into Features / Bug Fixes / Other using Conventional Commits.
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: Features
      regexp: "^feat"
    - title: Bug Fixes
      regexp: "^fix"
    - title: Others
      regexp: ".*"

