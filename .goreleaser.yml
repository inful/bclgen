# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: bclgen

# Build statically-linked binaries for the major OS/arch combinations.
builds:
  - id: bclgen
    main: ./cmd/bclgen
    binary: bclgen
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Group commits into Features / Bug Fixes / Other using Conventional Commits.
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: Features
      regexp: "^feat"
    - title: Bug Fixes
      regexp: "^fix"
    - title: Others
      regexp: ".*"

# Push a distroless multi-arch image to ghcr.io. The Dockerfile is
# auto-generated by goreleaser; no file in the repo is required.
dockers:
  - use: buildx
    dockerfile: Dockerfile
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/inful/bclgen:{{ .Version }}"
      - "ghcr.io/inful/bclgen:latest"
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Mock Illumina BCL run folder generator for testing bcl2fastq and similar tools"
      - "--label=org.opencontainers.image.source=https://github.com/inful/bclgen"
      - "--label=org.opencontainers.image.licenses=GPL-3.0-or-later"
